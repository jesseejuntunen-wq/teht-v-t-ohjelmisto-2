<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Results</title>
    <style>
        body {
            background-color: green;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            margin: 0;
            padding: 20px;
        }
        img {
            max-width: 800px;
            width: 100%;
            height: auto;
            border: 2px solid white;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        img:hover {
            transform: scale(1.02);
        }
        .image-container {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <h2>WAVE Testi</h2>
    <div class="image-container">
        <a href="img/kuva1.png" target="_blank">
            <img src="img/kuva1.png" alt="WAVE Testi">
        </a>
    </div>

    <h2>Lighthouse Testi</h2>
    <div class="image-container">
        <a href="img/kuva2.png" target="_blank">
            <img src="img/kuva2.png" alt="Lighthouse Testi">
        </a>
    </div>

    <h2>Käytetty fontti (CSS-koodi)</h2>
    <div class="image-container">
        <a href="img/kuva3.png" target="_blank">
            <img src="img/kuva3.png" alt="CSS-koodi fontista">
        </a>
    </div>

</body>
</html>
